<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff3d71" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MovieBox" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />
    <title>MovieBox</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07080c;
        color: #fff;
        min-height: 100vh;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(7, 8, 12, 0.95);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding: 16px 32px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .logo {
        font-size: 1.4rem;
        font-weight: 800;
        color: #fff;
        text-decoration: none;
        letter-spacing: -1px;
      }
      .search-wrap {
        position: relative;
        flex: 0 1 320px;
      }
      #search {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 10px 16px;
        color: #fff;
        font-size: 0.95rem;
        width: 100%;
        outline: none;
        transition: all 0.2s;
      }
      #search:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: #ff3d71;
      }
      #search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 8px;
        background: #0e0f14;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        max-height: 400px;
        overflow-y: auto;
        display: none;
      }
      #search-results:not(:empty) {
        display: block;
      }
      .search-result {
        display: block;
        padding: 12px 16px;
        color: #fff;
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.9rem;
      }
      .search-result:hover {
        background: rgba(255, 61, 113, 0.1);
      }
      nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      nav a {
        color: #9ea3ac;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all 0.2s;
      }
      nav a:hover,
      nav a.active {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }
      main {
        padding: 32px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .section {
        margin-bottom: 48px;
      }
      .section-header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 16px;
      }
      .section-header h2 {
        font-size: 1.4rem;
        font-weight: 700;
        cursor: pointer;
        transition: color 0.2s;
      }
      .section-header h2:hover {
        color: #ff3d71;
      }
      .count {
        color: #667;
        font-size: 0.85rem;
      }
      .row {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-bottom: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
      }
      .row::-webkit-scrollbar {
        height: 6px;
      }
      .row::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }
      .card {
        flex-shrink: 0;
        width: 180px;
        color: #fff;
        text-decoration: none;
        transition: transform 0.2s;
        cursor: pointer;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .poster {
        width: 100%;
        aspect-ratio: 2/3;
        background: #1a1b22;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 8px;
        position: relative;
      }
      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .no-poster {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        font-size: 2rem;
      }
      .card-title {
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.3;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-bottom: 4px;
      }
      .card-meta {
        font-size: 0.75rem;
        color: #667;
      }
      .badge {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.8);
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 0.65rem;
        font-weight: 700;
        color: #fff;
      }
      .heart {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.7);
        border: none;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.2s;
        padding: 0;
        line-height: 1;
        z-index: 2;
      }
      .card:hover .heart {
        opacity: 1;
      }
      .heart.saved {
        opacity: 1;
        color: #ff3d71;
      }
      .heart:hover {
        background: #ff3d71;
        transform: scale(1.1);
      }
      .progress-bar {
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 6px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: #ff3d71;
        border-radius: 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 24px;
        margin-top: 24px;
      }
      .filters {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .filter-btn {
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #9ea3ac;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.2s;
        cursor: pointer;
      }
      .filter-btn:hover,
      .filter-btn.active {
        background: #ff3d71;
        border-color: #ff3d71;
        color: #fff;
      }
      .sort-select,
      .catalog-search {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        color: #fff;
        font-size: 0.9rem;
        outline: none;
      }
      .catalog-search {
        min-width: 200px;
      }
      .catalog-meta {
        color: #667;
        font-size: 0.9rem;
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .pager {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 32px;
        align-items: center;
      }
      .page-btn {
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s;
      }
      .page-btn:hover {
        background: #ff3d71;
        border-color: #ff3d71;
      }
      .page-info {
        color: #667;
      }

      /* ─── HERO CAROUSEL ─────────────────────────────────────────────────────── */
      .hero {
        position: relative;
        width: 100%;
        height: clamp(380px, 52vh, 560px);
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 48px;
        background: #0e0f14;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .hero-slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.7s ease;
        pointer-events: none;
        z-index: 1;
      }
      .hero-slide.active {
        opacity: 1;
        pointer-events: auto;
        z-index: 2;
      }
      .hero-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center 30%;
        background-repeat: no-repeat;
        transform: scale(1.05);
        transition: transform 8s ease;
      }
      .hero-slide.active .hero-bg {
        transform: scale(1);
      }
      .hero-gradient {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(7, 8, 12, 0.92) 0%,
            rgba(7, 8, 12, 0.65) 45%,
            rgba(7, 8, 12, 0.15) 75%,
            rgba(7, 8, 12, 0.4) 100%
          ),
          linear-gradient(
            0deg,
            rgba(7, 8, 12, 0.95) 0%,
            rgba(7, 8, 12, 0.3) 30%,
            transparent 60%
          );
      }
      .hero-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 56px 56px 72px;
        max-width: 750px;
        z-index: 3;
      }
      .hero-badge {
        display: inline-block;
        background: linear-gradient(90deg, #ff3d71, #ff1a4f);
        color: #fff;
        padding: 5px 14px;
        border-radius: 6px;
        font-size: 0.72rem;
        font-weight: 800;
        margin-bottom: 18px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        box-shadow: 0 4px 15px rgba(255, 61, 113, 0.4);
      }
      .hero-title {
        font-size: clamp(1.8rem, 4.5vw, 3.2rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -1.5px;
        margin-bottom: 22px;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        max-width: 640px;
      }
      .hero-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .hero-btn {
        padding: 13px 26px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
      }
      .hero-btn-primary {
        background: #ff3d71;
        color: #fff;
        box-shadow: 0 6px 20px rgba(255, 61, 113, 0.35);
      }
      .hero-btn-primary:hover {
        background: #ff1a4f;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(255, 61, 113, 0.5);
      }
      .hero-btn-secondary {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
      }
      .hero-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.4);
      }
      .hero-btn-secondary.saved {
        background: rgba(255, 61, 113, 0.25);
        border-color: #ff3d71;
        color: #fff;
      }
      .hero-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 48px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        color: #fff;
        font-size: 1.6rem;
        cursor: pointer;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.25s;
        padding: 0;
        line-height: 1;
        font-family: inherit;
      }
      .hero:hover .hero-arrow {
        opacity: 1;
      }
      .hero-arrow:hover {
        background: #ff3d71;
        border-color: #ff3d71;
        transform: translateY(-50%) scale(1.08);
      }
      .hero-prev {
        left: 20px;
      }
      .hero-next {
        right: 20px;
      }
      .hero-dots {
        position: absolute;
        bottom: 22px;
        right: 32px;
        display: flex;
        gap: 8px;
        z-index: 4;
      }
      .hero-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        border: none;
        cursor: pointer;
        padding: 0;
        transition: all 0.3s;
        font-family: inherit;
      }
      .hero-dot.active {
        background: #ff3d71;
        width: 28px;
        border-radius: 4px;
        box-shadow: 0 0 15px rgba(255, 61, 113, 0.6);
      }
      .hero-dot:hover {
        background: rgba(255, 255, 255, 0.6);
      }

      .detail-header {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 40px;
        margin-top: 20px;
      }
      .detail-poster img {
        width: 100%;
        border-radius: 16px;
      }
      .detail-info h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 16px;
        letter-spacing: -1px;
        line-height: 1.1;
      }
      .detail-actions {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .desc {
        color: #9ea3ac;
        line-height: 1.6;
        margin-bottom: 20px;
        max-width: 700px;
      }
      .meta {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        color: #667;
        flex-wrap: wrap;
      }
      .meta span {
        padding: 4px 10px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .play-btn {
        padding: 14px 32px;
        background: #ff3d71;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .play-btn:hover {
        background: #ff1a4f;
        transform: translateY(-2px);
      }
      .icon-btn {
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 600;
        font-family: inherit;
      }
      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
      }
      .icon-btn.saved {
        background: rgba(255, 61, 113, 0.15);
        border-color: #ff3d71;
        color: #ff3d71;
      }
      .seasons {
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-top: 8px;
      }
      .season h3 {
        margin-bottom: 12px;
        font-size: 1.1rem;
      }
      .episodes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px;
      }
      .ep-btn {
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-size: 0.85rem;
        text-align: left;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
      }
      .ep-btn:hover {
        background: #ff3d71;
        border-color: #ff3d71;
      }
      .ep-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff3d71;
        flex-shrink: 0;
      }
      .raw-detail {
        margin-top: 40px;
        color: #667;
        font-size: 0.85rem;
      }
      .raw-detail summary {
        cursor: pointer;
        padding: 8px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 6px;
      }
      .raw-detail pre {
        margin-top: 8px;
        padding: 16px;
        background: #0e0f14;
        border-radius: 8px;
        overflow: auto;
        max-height: 400px;
        font-size: 0.75rem;
        color: #9ea3ac;
      }
      .player-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .player-container {
        width: 100%;
        max-width: 1200px;
        position: relative;
      }
      .player-video {
        width: 100%;
        max-height: 75vh;
        background: #000;
        border-radius: 12px;
        display: block;
      }
      .player-bar {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .player-info {
        color: #9ea3ac;
        font-size: 0.9rem;
        flex: 1 1 200px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .player-info strong {
        color: #fff;
      }
      .player-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .player-select {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        color: #fff;
        font-size: 0.85rem;
        outline: none;
        cursor: pointer;
        font-family: inherit;
      }
      .player-select:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .close-btn {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 44px;
        height: 44px;
        background: #ff3d71;
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.2s;
        font-family: inherit;
      }
      .close-btn:hover {
        transform: scale(1.1);
      }
      .resume-toast {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 0.85rem;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .resume-toast.show {
        opacity: 1;
      }
      .loading {
        padding: 60px;
        text-align: center;
        color: #667;
      }
      .error {
        padding: 40px;
        background: rgba(255, 61, 113, 0.1);
        border: 1px solid #ff3d71;
        border-radius: 12px;
        color: #ff3d71;
      }
      .empty {
        padding: 80px 40px;
        text-align: center;
        color: #667;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 16px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
      }
      .empty-icon {
        font-size: 3rem;
        margin-bottom: 16px;
        opacity: 0.5;
      }
      .empty-title {
        font-size: 1.2rem;
        color: #fff;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .cast {
        margin-top: 24px;
      }
      .cast-label {
        font-size: 0.8rem;
        color: #667;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .cast-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cast-chip {
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        font-size: 0.8rem;
        color: #ccc;
      }
      .languages {
        margin-top: 24px;
      }
      .lang-label {
        font-size: 0.8rem;
        color: #667;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .lang-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .lang-chip {
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        font-size: 0.8rem;
        color: #9ea3ac;
        text-decoration: none;
        transition: all 0.2s;
      }
      .lang-chip:hover {
        background: rgba(255, 61, 113, 0.1);
        border-color: #ff3d71;
        color: #fff;
      }
      .lang-chip.active {
        background: #ff3d71;
        border-color: #ff3d71;
        color: #fff;
        font-weight: 700;
      }
      .access-note {
        margin-top: 12px;
        color: #667;
        font-size: 0.85rem;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 6px;
        border-left: 2px solid #ff3d71;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .page-header h1 {
        font-size: 1.8rem;
        font-weight: 800;

      @media (max-width: 768px) {

    </style>
  </head>
  <body>
    <header>
      <a href="#/" class="logo">MovieBox</a>
      <div class="search-wrap">
        <input
          id="search"
          placeholder="Search movies, series, anime..."
          autocomplete="off"
        />
        <div id="search-results"></div>
      </div>
      <nav id="main-nav">
        <a href="#/" data-nav="/">Home</a>
        <a href="#/catalog" data-nav="/catalog">Catalog</a>
        <a href="#/bookmarks" data-nav="/bookmarks">Bookmarks</a>
        <a href="#/history" data-nav="/history">History</a>
      </nav>
    </header>
    <main id="app"></main>
    <footer
      style="
        text-align: center;
        padding: 40px 16px 24px;
        color: #445;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
      "
    >
      Built by
      <a
        href="https://github.com/faisaljs"
        target="_blank"
        style="color: #ff3d71; text-decoration: none; font-weight: 600"
        >faisaljs</a
      >
      ·
      <a
        href="https://github.com/faisaljs/Moviebox-API"
        target="_blank"
        style="color: #667; text-decoration: none"
        >source</a
      >
    </footer>
    <script>
      const $ = (sel) => document.querySelector(sel);

      function qs(params) {
        const clean = {};
        for (const k in params) {
          if (params[k] !== null && params[k] !== undefined && params[k] !== "")
            clean[k] = params[k];
        }
        return new URLSearchParams(clean).toString();
      }

      async function api(path, params) {
        const url =
          path + (params && Object.keys(params).length ? "?" + qs(params) : "");
        const r = await fetch(url);
        if (!r.ok) {
          const t = await r.text();
          throw new Error(`${r.status}: ${t.slice(0, 200)}`);
        }
        return r.json();
      }

      async function apiPost(path, body) {
        const r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const t = await r.text();
          throw new Error(`${r.status}: ${t.slice(0, 200)}`);
        }
        return r.json();
      }

      function el(tag, attrs, ...children) {
        const e = document.createElement(tag);
        if (attrs) {
          for (const k in attrs) {
            const v = attrs[k];
            if (v == null || v === false) continue;
            if (k === "class") e.className = v;
            else if (k.startsWith("on") && typeof v === "function")
              e.addEventListener(k.slice(2), v);
            else e.setAttribute(k, v);
          }
        }
        for (const c of children) {
          if (c == null || c === false) continue;
          e.append(
            typeof c === "string" || typeof c === "number"
              ? document.createTextNode(c)
              : c,
          );
        }
        return e;
      }

      function escape(str) {
        return String(str ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function formatTime(seconds) {
        if (!seconds || !isFinite(seconds) || seconds < 0) return "0:00";
        const s = Math.floor(seconds);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        return h > 0
          ? `${h}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`
          : `${m}:${String(ss).padStart(2, "0")}`;
      }

      // ─── SERVER-SIDE USER DATA ──────────────────────────────────────────────────
      let _bookmarksCache = {}; // slug -> bookmark object
      let _historyCache = []; // array sorted by updated_at desc, most recent first

      async function loadUserData() {
        try {
          const [b, h] = await Promise.all([
            api("/user/bookmarks"),
            api("/user/history"),
          ]);
          _bookmarksCache = {};
          for (const bm of b.bookmarks || []) {
            _bookmarksCache[bm.slug] = bm;
          }
          _historyCache = h.history || [];
        } catch (e) {
          console.warn("Failed to load user data from server:", e);
          _bookmarksCache = {};
          _historyCache = [];
        }
      }

      function getBookmarks() {
        return _bookmarksCache;
      }
      function isBookmarked(slug) {
        return !!_bookmarksCache[slug];
      }

      async function toggleBookmark(item) {
        if (_bookmarksCache[item.slug]) {
          delete _bookmarksCache[item.slug];
          try {
            await fetch(`/user/bookmarks/${encodeURIComponent(item.slug)}`, {
              method: "DELETE",
            });
          } catch (_) {}
        } else {
          _bookmarksCache[item.slug] = { ...item, saved_at: Date.now() / 1000 };
          try {
            await apiPost("/user/bookmarks", item);
          } catch (_) {}
        }
        document
          .querySelectorAll(`.heart[data-slug="${CSS.escape(item.slug)}"]`)
          .forEach((h) => {
            h.classList.toggle("saved", !!_bookmarksCache[item.slug]);
            h.textContent = _bookmarksCache[item.slug] ? "♥" : "♡";
          });
      }

      function getHistory() {
        return _historyCache;
      }

      function saveHistoryEntry(entry) {
        if (!entry.slug || entry.se == null || entry.ep == null) return;
        const idx = _historyCache.findIndex(
          (h) =>
            h.slug === entry.slug && h.se === entry.se && h.ep === entry.ep,
        );
        const full = {
          slug: entry.slug,
          se: entry.se,
          ep: entry.ep,
          name: entry.name,
          poster_url: entry.poster_url,
          position: Math.max(0, Math.floor(entry.position || 0)),
          duration: Math.max(0, Math.floor(entry.duration || 0)),
          updated_at: Date.now() / 1000,
        };
        if (idx >= 0) _historyCache.splice(idx, 1);
        _historyCache.unshift(full);
        apiPost("/user/history", full).catch(() => {});
      }

      function getHistoryEntry(slug, se, ep) {
        return _historyCache.find(
          (h) => h.slug === slug && h.se === se && h.ep === ep,
        );
      }

      function isWatched(slug, se, ep) {
        const entry = getHistoryEntry(slug, se, ep);
        return !!entry && entry.position > 5;
      }

      function recentHistoryForContinue(
        dedupeBySlug = true,
        minProgress = 30,
        limit = 8,
      ) {
        const all = _historyCache.filter(
          (h) => (h.position || 0) >= minProgress,
        );
        if (!dedupeBySlug) return all.slice(0, limit);
        const seen = new Set();
        const out = [];
        for (const h of all) {
          if (seen.has(h.slug)) continue;
          seen.add(h.slug);
          out.push(h);
          if (out.length >= limit) break;
        }
        return out;
      }

      // ─── HERO CAROUSEL ──────────────────────────────────────────────────────────
      function renderBannerCarousel(items) {
        const heroEl = el("div", { class: "hero" });
        const slides = [];
        let currentIndex = 0;
        let autoplayTimer = null;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          const slide = el("div", {
            class: `hero-slide${i === 0 ? " active" : ""}`,
          });

          if (item.poster_url) {
            slide.append(
              el("div", {
                class: "hero-bg",
                style: `background-image:url("${item.poster_url.replace(/"/g, "")}")`,
              }),
            );
          }
          slide.append(el("div", { class: "hero-gradient" }));

          const saved = isBookmarked(item.slug);
          const saveBtn = el(
            "button",
            {
              class: `hero-btn hero-btn-secondary${saved ? " saved" : ""}`,
              onclick: async (e) => {
                e.stopPropagation();
                await toggleBookmark(item);
                const isSaved = isBookmarked(item.slug);
                e.currentTarget.classList.toggle("saved", isSaved);
                e.currentTarget.textContent = isSaved ? "♥ Saved" : "♡ Save";
              },
            },
            saved ? "♥ Saved" : "♡ Save",
          );

          slide.append(
            el(
              "div",
              { class: "hero-content" },
              item.badge
                ? el("div", { class: "hero-badge" }, item.badge)
                : null,
              el("h1", { class: "hero-title" }, item.name || ""),
              el(
                "div",
                { class: "hero-actions" },
                el(
                  "a",
                  {
                    class: "hero-btn hero-btn-primary",
                    href: `#/detail/${item.slug}`,
                  },
                  "▶ Watch Now",
                ),
                saveBtn,
              ),
            ),
          );

          slides.push(slide);
          heroEl.append(slide);
        }

        const dots = el("div", { class: "hero-dots" });
        for (let i = 0; i < items.length; i++) {
          dots.append(
            el("button", {
              class: `hero-dot${i === 0 ? " active" : ""}`,
              onclick: () => show(i),
            }),
          );
        }
        heroEl.append(dots);

        const prevBtn = el(
          "button",
          {
            class: "hero-arrow hero-prev",
            onclick: () =>
              show((currentIndex - 1 + items.length) % items.length),
          },
          "‹",
        );
        const nextBtn = el(
          "button",
          {
            class: "hero-arrow hero-next",
            onclick: () => show((currentIndex + 1) % items.length),
          },
          "›",
        );
        heroEl.append(prevBtn, nextBtn);

        function show(idx) {
          currentIndex = idx;
          slides.forEach((s, i) => s.classList.toggle("active", i === idx));
          dots
            .querySelectorAll(".hero-dot")
            .forEach((d, i) => d.classList.toggle("active", i === idx));
          resetAutoplay();
        }

        function resetAutoplay() {
          if (autoplayTimer) clearInterval(autoplayTimer);
          autoplayTimer = setInterval(() => {
            if (!document.body.contains(heroEl)) {
              clearInterval(autoplayTimer);
              autoplayTimer = null;
              return;
            }
            show((currentIndex + 1) % items.length);
          }, 6000);
        }

        if (items.length > 1) {
          resetAutoplay();
          heroEl.addEventListener("mouseenter", () => {
            if (autoplayTimer) {
              clearInterval(autoplayTimer);
              autoplayTimer = null;
            }
          });
          heroEl.addEventListener("mouseleave", resetAutoplay);
        }

        return heroEl;
      }

      function renderCard(item, opts = {}) {
        const saved = isBookmarked(item.slug);
        const card = el("div", {
          class: "card",
          onclick: () => {
            location.hash = `#/detail/${item.slug || ""}`;
          },
        });

        const poster = el(
          "div",
          { class: "poster" },
          item.poster_url
            ? el("img", {
                src: item.poster_url,
                loading: "lazy",
                alt: item.name || "",
              })
            : el("div", { class: "no-poster" }, "?"),
          item.badge ? el("div", { class: "badge" }, item.badge) : null,
          el(
            "button",
            {
              class: `heart${saved ? " saved" : ""}`,
              "data-slug": item.slug || "",
              onclick: async (e) => {
                e.stopPropagation();
                await toggleBookmark(item);
              },
              title: saved ? "Remove bookmark" : "Save to bookmarks",
            },
            saved ? "♥" : "♡",
          ),
        );
        card.append(poster);
        card.append(el("div", { class: "card-title" }, item.name || "?"));

        const meta = [];
        if (item.rating) meta.push(`★ ${item.rating}`);
        if (item.year) meta.push(item.year);
        card.append(el("div", { class: "card-meta" }, meta.join(" · ")));

        if (opts.progress && opts.progress.duration > 0) {
          const pct = Math.min(
            100,
            (opts.progress.position / opts.progress.duration) * 100,
          );
          card.append(
            el(
              "div",
              { class: "progress-bar" },
              el("div", { class: "progress-fill", style: `width:${pct}%` }),
            ),
          );
        }

        if (opts.resumeOnClick) {
          card.append(
            el(
              "button",
              {
                class: "resume-btn",
                onclick: (e) => {
                  e.stopPropagation();
                  opts.resumeOnClick();
                },
              },
              opts.resumeLabel || "▶ Resume",
            ),
          );
        }

        return card;
      }

      function renderHistoryCard(entry) {
        const card = renderCard(
          { name: entry.name, slug: entry.slug, poster_url: entry.poster_url },
          {
            progress: { position: entry.position, duration: entry.duration },
            resumeLabel:
              entry.position > 0
                ? `▶ Resume ${formatTime(entry.position)}`
                : "▶ Play",
            resumeOnClick: () =>
              openPlayerBySlug(entry.slug, entry.se, entry.ep),
          },
        );
        card.classList.add("history-card");
        card.append(
          el(
            "div",
            { class: "history-meta" },
            el("span", { class: "badge-inline" }, `S${entry.se} E${entry.ep}`),
            el(
              "span",
              {},
              entry.duration > 0
                ? `${formatTime(entry.position)} / ${formatTime(entry.duration)}`
                : formatTime(entry.position),
            ),
          ),
        );
        return card;
      }

      // ─── HOME ───────────────────────────────────────────────────────────────────
      async function renderHome() {
        const app = $("#app");
        app.innerHTML = '<div class="loading">Loading...</div>';
        try {
          const recent = _historyCache[0];
          const [data, rec, recs] = await Promise.all([
            api("/home"),
            recent
              ? api(`/recommendations/because/${recent.slug}`, {
                  limit: 12,
                }).catch(() => null)
              : null,
            api("/recommendations", { limit: 12 }).catch(() => null),
          ]);
          app.innerHTML = "";

          // 1. Hero carousel
          let bannerItems = null;
          for (const section of data.sections) {
            if (section.section === "Banner") {
              bannerItems = section.items;
              break;
            }
          }
          if (bannerItems && bannerItems.length > 0) {
            app.append(renderBannerCarousel(bannerItems));
          }

          // 2. Continue watching
          const cont = recentHistoryForContinue(true, 30, 8);
          if (cont.length > 0) {
            app.append(
              el(
                "section",
                { class: "section" },
                el(
                  "div",
                  { class: "section-header" },
                  el(
                    "h2",
                    {
                      onclick: () => {
                        location.hash = "#/history";
                      },
                    },
                    "Continue Watching",
                  ),
                  el("span", { class: "count" }, `${cont.length} in progress`),
                ),
                el("div", { class: "row" }, ...cont.map(renderHistoryCard)),
              ),
            );
          }

          // 3. Because you watched
          if (rec && rec.items && rec.items.length > 0) {
            const label = `Because you watched ${rec.title || (recent && recent.name) || "a title"}`;
            app.append(
              el(
                "section",
                { class: "section" },
                el(
                  "div",
                  { class: "section-header" },
                  el("h2", {}, label),
                  el("span", { class: "count" }, `${rec.items.length} similar`),
                ),
                el(
                  "div",
                  { class: "row" },
                  ...rec.items.map((i) => renderCard(i)),
                ),
              ),
            );
          }

          // 4. For You / Top Rated
          if (recs && recs.items && recs.items.length > 0) {
            const label = _historyCache.length > 0 ? "For You" : "Top Rated";
            app.append(
              el(
                "section",
                { class: "section" },
                el(
                  "div",
                  { class: "section-header" },
                  el("h2", {}, label),
                  el("span", { class: "count" }, `${recs.count} picks`),
                ),
                el(
                  "div",
                  { class: "row" },
                  ...recs.items.map((i) => renderCard(i)),
                ),
              ),
            );
          }

          // 5. Home sections
          for (const section of data.sections) {
            if (!section.items.length) continue;
            if (section.section === "Banner") continue;
            const header = el(
              "div",
              { class: "section-header" },
              el(
                "h2",
                {
                  onclick: () => {
                    location.hash = `#/browse/${encodeURIComponent(section.section)}`;
                  },
                },
                section.section,
              ),
              el("span", { class: "count" }, `${section.count} items`),
            );
            const row = el(
              "div",
              { class: "row" },
              ...section.items.map(renderCard),
            );
            app.append(el("section", { class: "section" }, header, row));
          }
        } catch (e) {
          app.innerHTML = `<div class="error">${escape(e.message)}</div>`;
        }
      }

      // ─── CATALOG ────────────────────────────────────────────────────────────────
      async function renderCatalog(params) {
        const app = $("#app");
        const type = params.get("type") || "all";
        const sort = params.get("sort") || "recent";
        const page = parseInt(params.get("page") || "1");
        const q = params.get("q") || "";

        app.innerHTML = '<div class="loading">Loading...</div>';
        try {
          const query = { type, sort, page, per_page: 24 };
          if (q) query.q = q;
          const data = await api("/catalog", query);
          app.innerHTML = "";

          const filters = el("div", { class: "filters" });
          for (const t of ["all", "movie", "tv", "anime"]) {
            filters.append(
              el(
                "a",
                {
                  class: `filter-btn${t === type ? " active" : ""}`,
                  href: `#/catalog?${qs({ type: t, sort, q })}`,
                },
                t === "all" ? "All" : t.charAt(0).toUpperCase() + t.slice(1),
              ),
            );
          }
          const sortSelect = el("select", {
            class: "sort-select",
            onchange: (e) => {
              location.hash = `#/catalog?${qs({ type, sort: e.target.value, q })}`;
            },
          });
          for (const s of ["recent", "title", "rating"]) {
            const opt = el(
              "option",
              { value: s },
              s === "recent"
                ? "Recent"
                : s === "title"
                  ? "Title A-Z"
                  : "Rating",
            );
            if (s === sort) opt.selected = true;
            sortSelect.append(opt);
          }
          filters.append(sortSelect);

          const catalogSearch = el("input", {
            class: "catalog-search",
            placeholder: "Search titles (Enter)...",
            value: q,
            onkeydown: (e) => {
              if (e.key === "Enter") {
                location.hash = `#/catalog?${qs({ type, sort, q: e.target.value })}`;
              }
            },
          });
          filters.append(catalogSearch);

          app.append(filters);

          const sourceNote =
            data.source === "upstream_fallback" ? " · live results" : "";
          app.append(
            el(
              "div",
              { class: "catalog-meta" },
              el(
                "span",
                {},
                `${data.total} results · page ${data.page} of ${data.total_pages || 1}${sourceNote}`,
              ),
            ),
          );

          const grid = el("div", { class: "grid" });
          for (const item of data.items) {
            const badge = (item.types || [])[0];
            grid.append(renderCard({ ...item, badge }));
          }
          app.append(grid);

          if ((data.total_pages || 0) > 1) {
            const pager = el("div", { class: "pager" });
            const base = { type, sort, q };
            if (page > 1)
              pager.append(
                el(
                  "a",
                  {
                    class: "page-btn",
                    href: `#/catalog?${qs({ ...base, page: page - 1 })}`,
                  },
                  "← Prev",
                ),
              );
            pager.append(
              el(
                "span",
                { class: "page-info" },
                `${page} / ${data.total_pages}`,
              ),
            );
            if (page < data.total_pages)
              pager.append(
                el(
                  "a",
                  {
                    class: "page-btn",
                    href: `#/catalog?${qs({ ...base, page: page + 1 })}`,
                  },
                  "Next →",
                ),
              );
            app.append(pager);
          }
        } catch (e) {
          app.innerHTML = `<div class="error">${escape(e.message)}</div>`;
        }
      }

      // ─── BROWSE ─────────────────────────────────────────────────────────────────

      // ─── DETAIL ─────────────────────────────────────────────────────────────────
      function extractSeasons(resource) {
        if (!resource) return [];
        const candidates = [
          resource.seasons,
          resource.seasonList,
          (resource.data || {}).seasons,
          (resource.metadata || {}).seasons,
        ].filter(Array.isArray);
        for (const c of candidates) {
          if (
            c.length &&
            (c[0].se !== undefined || c[0].episodes || c[0].maxEp !== undefined)
          )
            return c;
        }
        return [];
      }

      function episodesFromSeason(season) {
        if (Array.isArray(season.episodes) && season.episodes.length) {
          return season.episodes
            .map((e) => ({
              ep: e.ep || e.episode || e.epNum || 0,
              name: e.name || "",
            }))
            .filter((e) => e.ep > 0);
        }
        if (season.maxEp && season.maxEp > 0) {
          const out = [];
          for (let i = 1; i <= season.maxEp; i++) out.push({ ep: i, name: "" });
          return out;
        }
        if (
          Array.isArray(season.resolutions) &&
          season.resolutions[0] &&
          season.resolutions[0].epNum
        ) {
          const out = [];
          for (let i = 1; i <= season.resolutions[0].epNum; i++)
            out.push({ ep: i, name: "" });
          return out;
        }
        return [];
      }

      async function renderDetail(slug) {
        const app = $("#app");
        app.innerHTML = '<div class="loading">Loading...</div>';
        try {
          const data = await api(`/detail/${slug}`);
          const root = data.data || {};
          const subject = root.subject || {};
          const resource = root.resource || {};
          const sid = subject.subjectId;
          app.innerHTML = "";

          const posterUrl = (subject.cover || {}).url;
          const poster = el(
            "div",
            { class: "detail-poster" },
            posterUrl
              ? el("img", { src: posterUrl, alt: subject.title || "" })
              : null,
          );

          const metaItems = [];
          if (subject.releaseDate)
            metaItems.push((subject.releaseDate || "").slice(0, 4));
          if (subject.imdbRatingValue)
            metaItems.push(`★ ${subject.imdbRatingValue}`);
          if (subject.genre) metaItems.push(subject.genre);

          const playArea = el("div", {});
          const seasons = extractSeasons(resource);
          const access = root.accessStrategy || {};
          const freeEps = access.freeEpisodeCount || 0;

          if (seasons.length) {
            const seasonsDiv = el("div", { class: "seasons" });
            for (const season of seasons) {
              const se = season.se || 1;
              const eps = episodesFromSeason(season);
              if (!eps.length) continue;

                "div",
                { class: "season" },
                el(

                ),
              );
              const epGrid = el("div", { class: "episodes" });
              for (const epInfo of eps) {
                const watched = isWatched(slug, se, epInfo.ep);
                const btn = el("button", {
                  class: "ep-btn",
                  onclick: () =>
                    openPlayer(
                      sid,
                      slug,
                      se,
                      epInfo.ep,
                      eps,
                      subject.title || "",
                      posterUrl,
                    ),
                });
                if (watched) btn.append(el("span", { class: "ep-dot" }));
                btn.append(`Ep ${epInfo.ep}`);
                epGrid.append(btn);
              }
              seasonDiv.append(epGrid);
              seasonsDiv.append(seasonDiv);

            if (seasonsDiv.children.length) {
              playArea.append(seasonsDiv);
              if (freeEps > 0) {
                const previewMin = access.previewSeconds
                  ? Math.round(access.previewSeconds / 60)
                  : 0;
                playArea.append(
                  el(
                    "div",
                    { class: "access-note" },
                    `Upstream marks eps 1–${freeEps} as free${previewMin ? ` (${previewMin}min preview after)` : ""}.`,
                  ),

            } else {
              playArea.append(
                el(
                  "button",
                  {
                    class: "play-btn",
                    onclick: () =>
                      openPlayer(
                        sid,
                        slug,
                        0,
                        0,
                        [],
                        subject.title || "",
                        posterUrl,
                      ),
                  },

                ),

          } else {

              el(
                "button",
                {
                  class: "play-btn",
                  onclick: () =>
                    openPlayer(
                      sid,
                      slug,
                      0,
                      0,
                      [],
                      subject.title || "",
                      posterUrl,
                    ),
                },
                "▶ Play",
              ),
            );
          }

          const saved = isBookmarked(slug);
          const bookmarkBtn = el(
            "button",
            {
              class: `icon-btn${saved ? " saved" : ""}`,
              onclick: async (e) => {
                await toggleBookmark({
                  slug,
                  name: subject.title || "",
                  poster_url: posterUrl,
                  rating: subject.imdbRatingValue,
                  year: (subject.releaseDate || "").slice(0, 4),
                  badge: subject.corner,
                });
                const btn = e.currentTarget;
                const nowSaved = isBookmarked(slug);
                btn.classList.toggle("saved", nowSaved);
                btn.textContent = nowSaved ? "♥ Saved" : "♡ Bookmark";
              },

            saved ? "♥ Saved" : "♡ Bookmark",

          const trailer = (subject.trailer || {}).videoAddress || {};

            ? el(

            ? el(
                "div",
                { class: "cast" },

                    .slice(0, 8)

                        { class: "cast-chip" },

            : null;

          const dubs = subject.dubs || [];

                          href: `#/detail/${d.detailPath}`,

      function openTrailerPlayer(url, title) {
        document.querySelectorAll(".player-overlay").forEach((n) => n.remove());

        const overlay = el(
          "div",
          { class: "player-overlay" },
          el(
            "div",
            { class: "player-container" },
            el(
              "button",
              { class: "close-btn", onclick: () => overlay.remove() },
              "✕",
            ),
            el(
              "video",
              {
                class: "player-video",
                controls: "controls",
                autoplay: "autoplay",
                playsinline: "",
              },
              el("source", { src: url, type: "video/mp4" }),
            ),
            el(
              "div",
              { class: "player-bar" },
              el(
                "div",
                { class: "player-info" },
                el("strong", {}, "Trailer"),
                title ? ` · ${title}` : "",
              ),
            ),
          ),
        );
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
        document.addEventListener("keydown", function esc(e) {
          if (e.key === "Escape" && !document.fullscreenElement) {
            overlay.remove();
            document.removeEventListener("keydown", esc);
          }
        });
        document.body.append(overlay);
      }

      async function openPlayer(
        sid,
        slug,
        se,
        ep,
        episodeList,
        showTitle,
        posterUrl,
      ) {
        document.querySelectorAll(".player-overlay").forEach((n) => n.remove());

        const overlay = el(
          "div",
          { class: "player-overlay" },
          el(
            "div",
            { class: "player-container" },
            el("div", { class: "loading" }, `Loading episode ${ep}...`),
          ),
        );
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
        document.addEventListener("keydown", function esc(e) {
          if (e.key === "Escape" && !document.fullscreenElement) {
            overlay.remove();
            document.removeEventListener("keydown", esc);
          }
        });
        document.body.append(overlay);

        const container = overlay.querySelector(".player-container");
        const buildHeader = (title) => {
          container.innerHTML = "";
          container.append(
            el(
              "button",
              { class: "close-btn", onclick: () => overlay.remove() },
              "✕",
            ),
          );
          if (title)
            container.append(
              el(
                "div",
                {
                  class: "player-info",
                  style: "margin-bottom:12px;color:#fff",
                },
                title,
              ),
            );
        };

        try {
          const stream = await api(`/api/stream/${sid}`, {
            detail_path: slug,
            se,
            ep,
          });
          const noResource =
            !stream.has_resource || !stream.sources || !stream.sources.length;

          if (noResource) {
            const label = se === 0 && ep === 0 ? "Movie" : `Episode ${ep}`;
            buildHeader(`${label} — not available`);
            container.append(
              el(
                "div",
                {
                  class: "access-note",
                  style: "padding:16px;font-size:0.95rem",
                },
                stream.note || "This episode has no stream right now.",
              ),
            );
            const available = (episodeList || []).filter((e) => e.ep !== ep);
            if (available.length) {
              container.append(
                el(
                  "div",
                  { class: "cast-label", style: "margin-top:16px" },
                  "Try another episode",
                ),
              );
              const picker = el("div", {
                class: "episodes",
                style: "max-height:200px;overflow-y:auto",
              });
              for (const alt of available) {
                picker.append(
                  el(
                    "button",
                    {
                      class: "ep-btn",
                      onclick: () =>
                        openPlayer(
                          sid,
                          slug,
                          se,
                          alt.ep,
                          episodeList,
                          showTitle,
                          posterUrl,
                        ),
                    },
                    `Ep ${alt.ep}`,
                  ),
                );
              }
              container.append(picker);
            }
            return;
          }

          const sources = [...stream.sources].sort(
            (a, b) =>
              (parseInt(b.resolution) || 0) - (parseInt(a.resolution) || 0),
          );
          const bestRes = sources[0].resolution || "best";

          let captions = [];
          try {
            const capData = await api(`/api/stream/${sid}/captions`, {
              detail_path: slug,
              se,
              ep,
            });
            captions = capData.captions || [];
          } catch (_) {}

          container.innerHTML = "";
          container.append(
            el(
              "button",
              { class: "close-btn", onclick: () => overlay.remove() },
              "✕",
            ),
          );

          const video = el("video", {
            class: "player-video",
            controls: "controls",
            autoplay: "autoplay",
            playsinline: "",
            crossorigin: "anonymous",
          });

          const buildProxyUrl = (res) =>
            `/api/stream/${sid}/proxy?${qs({ detail_path: slug, se, ep, res })}`;
          const sourceEl = el("source", {
            src: buildProxyUrl(bestRes),
            type: "video/mp4",
          });
          video.append(sourceEl);

          for (const cap of captions) {
            const trackUrl = `/api/stream/${sid}/subtitles/${cap.lan}?${qs({ detail_path: slug, se, ep })}`;
            video.append(
              el("track", {
                kind: "subtitles",
                src: trackUrl,
                srclang: cap.lan,
                label: cap.lanName || cap.lan,
              }),
            );
          }

          const qualitySelect = el("select", {
            class: "player-select",
            title: "Quality",
          });
          for (const s of sources) {
            const opt = el(
              "option",
              { value: s.resolution || "best" },
              s.resolution || "best",
            );
            if (s.resolution === bestRes) opt.selected = true;
            qualitySelect.append(opt);
          }
          qualitySelect.addEventListener("change", (e) => {
            const newRes = e.target.value;
            const t = video.currentTime;
            const wasPlaying = !video.paused;
            sourceEl.src = buildProxyUrl(newRes);
            video.load();
            video.addEventListener(
              "loadedmetadata",
              () => {
                video.currentTime = t;
                if (wasPlaying) video.play();
              },
              { once: true },
            );
          });

          const subSelect = el("select", {
            class: "player-select",
            title: "Subtitles",
          });
          subSelect.append(el("option", { value: "-1" }, "Subtitles off"));
          captions.forEach((cap, i) => {
            subSelect.append(
              el("option", { value: String(i) }, cap.lanName || cap.lan),
            );
          });
          const defaultIdx = captions.findIndex(
            (c) => (c.lan || "").toLowerCase() === "en",
          );
          const initialSubIdx =
            defaultIdx >= 0 ? defaultIdx : captions.length > 0 ? 0 : -1;
          subSelect.value = String(initialSubIdx);

          function applySubtitle(idx) {
            const tracks = video.textTracks;
            for (let i = 0; i < tracks.length; i++) {
              tracks[i].mode = i === idx ? "showing" : "disabled";
            }
          }
          subSelect.addEventListener("change", (e) =>
            applySubtitle(parseInt(e.target.value)),
          );
          video.addEventListener(
            "loadedmetadata",
            () => applySubtitle(initialSubIdx),
            { once: true },
          );

          container.append(video);

          const episodeLabel = se === 0 && ep === 0 ? "Movie" : `Episode ${ep}`;
          const infoLeft = el(
            "div",
            { class: "player-info" },
            el("strong", {}, episodeLabel),
            showTitle ? ` · ${showTitle}` : "",
            ` · ${sources.length} qualit${sources.length === 1 ? "y" : "ies"}`,
            captions.length
              ? ` · ${captions.length} subtitle track${captions.length === 1 ? "" : "s"}`
              : "",
          );

          container.append(
            el(
              "div",
              { class: "player-bar" },
              infoLeft,
              el(
                "div",
                { class: "player-controls" },
                qualitySelect,
                captions.length ? subSelect : null,
              ),
            ),
          );

          const existing = getHistoryEntry(slug, se, ep);
          if (existing && existing.position > 10) {
            const toast = el(
              "div",
              { class: "resume-toast" },
              `Resumed from ${formatTime(existing.position)}`,
            );
            video.addEventListener(
              "loadedmetadata",
              () => {
                if (existing.position < video.duration - 15) {
                  video.currentTime = existing.position;
                  toast.classList.add("show");
                  setTimeout(() => toast.classList.remove("show"), 3000);
                }
              },
              { once: true },
            );
            container.append(toast);
          }

          let lastSave = 0;
          const persist = (force = false) => {
            const now = Date.now();
            if (!force && now - lastSave < 5000) return;
            lastSave = now;
            saveHistoryEntry({
              slug,
              name: showTitle || "",
              poster_url: posterUrl,
              se,
              ep,
              position: video.currentTime || 0,
              duration: video.duration || 0,
            });
          };

          video.addEventListener("timeupdate", () => persist(false));
          video.addEventListener("pause", () => persist(true));
          video.addEventListener("ended", () => persist(true));

          video.addEventListener("error", () => {
            const label = se === 0 && ep === 0 ? "Movie" : `Episode ${ep}`;
            buildHeader(`${label} — stream failed`);
            container.append(
              el(
                "div",
                { class: "access-note", style: "padding:16px" },
                "Upstream returned an error for this source.",
              ),
            );
          });

          const keyHandler = (e) => {
            if (!document.body.contains(overlay)) {
              document.removeEventListener("keydown", keyHandler);
              return;
            }
            if (
              e.target.tagName === "INPUT" ||
              e.target.tagName === "TEXTAREA" ||
              e.target.tagName === "SELECT"
            )
              return;
            switch (e.key) {
              case " ":
              case "k":
                e.preventDefault();
                video.paused ? video.play() : video.pause();
                break;
              case "ArrowLeft":
                e.preventDefault();
                video.currentTime = Math.max(0, video.currentTime - 5);
                break;
              case "ArrowRight":
                e.preventDefault();
                video.currentTime = Math.min(
                  video.duration || 0,
                  video.currentTime + 5,
                );
                break;
              case "ArrowUp":
                e.preventDefault();
                video.volume = Math.min(1, video.volume + 0.1);
                break;
              case "ArrowDown":
                e.preventDefault();
                video.volume = Math.max(0, video.volume - 0.1);
                break;
              case "f":
                e.preventDefault();
                if (video.requestFullscreen) {
                  document.fullscreenElement
                    ? document.exitFullscreen()
                    : video.requestFullscreen();
                }
                break;
              case "m":
                e.preventDefault();
                video.muted = !video.muted;
                break;
            }
          };
          document.addEventListener("keydown", keyHandler);

          const origRemove = overlay.remove.bind(overlay);
          overlay.remove = () => {
            persist(true);
            origRemove();
          };
        } catch (e) {
          const container = overlay.querySelector(".player-container");
          container.innerHTML = "";
          container.append(
            el(
              "button",
              { class: "close-btn", onclick: () => overlay.remove() },
              "✕",
            ),
          );
          container.append(el("div", { class: "error" }, e.message));
        }
      }

      // ─── SEARCH ─────────────────────────────────────────────────────────────────
      let searchTimer;
      $("#search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const q = e.target.value.trim();
          if (q.length < 2) return;
          e.preventDefault();
          $("#search-results").innerHTML = "";
          $("#search").value = "";
          $("#search").blur();
          location.hash = `#/catalog?${qs({ q })}`;
        }
      });
      $("#search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        const results = $("#search-results");
        if (q.length < 2) {
          results.innerHTML = "";
          return;
        }
        searchTimer = setTimeout(async () => {
          try {
            const data = await api("/search/suggest", { q, enrich: "true" });
            results.innerHTML = "";
            for (const s of data.suggestions || []) {
              if (!s.slug) continue;
              results.append(
                el(
                  "a",
                  {
                    class: "search-result",
                    href: `#/detail/${s.slug}`,
                    onclick: () => {
                      results.innerHTML = "";
                      $("#search").value = "";
                    },
                  },
                  s.title,
                ),
              );
            }
            if ((data.suggestions || []).length > 0) {
              results.append(
                el(
                  "a",
                  {
                    class: "search-result",
                    href: `#/catalog?${qs({ q })}`,
                    style:
                      "background:rgba(255,61,113,0.08);font-weight:600;color:#ff3d71;text-align:center",
                    onclick: () => {
                      results.innerHTML = "";
                      $("#search").value = "";
                    },
                  },
                  `See all results for "${q}" →`,
                ),
              );
            }
          } catch (_) {
            results.innerHTML = "";
          }
        }, 300);
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search-wrap"))
          $("#search-results").innerHTML = "";
      });

      // ─── ROUTER ─────────────────────────────────────────────────────────────────
      function updateNav(path) {
        document.querySelectorAll("#main-nav a").forEach((a) => {
          const navPath = a.getAttribute("data-nav");
          const matches =
            path === navPath || (navPath !== "/" && path.startsWith(navPath));
          a.classList.toggle("active", matches);
        });
      }

      function route() {
        const hash = location.hash.slice(1) || "/";
        const [path, queryString] = hash.split("?");
        const params = new URLSearchParams(queryString || "");
        const parts = path.split("/").filter(Boolean);

        updateNav(path.startsWith("/") ? path : "/" + path);

        if (parts.length === 0) {
          renderHome();
          return;
        }
        switch (parts[0]) {
          case "catalog":
            renderCatalog(params);
            break;
          case "browse":
            parts[1]
              ? renderBrowse(decodeURIComponent(parts[1]))
              : renderHome();
            break;
          case "detail":
            parts[1]
              ? renderDetail(decodeURIComponent(parts[1]))
              : renderHome();
            break;
          case "bookmarks":
            renderBookmarks();
            break;
          case "history":
            renderHistory();
            break;
          default:
            renderHome();
        }
      }

      window.addEventListener("hashchange", route);

      // Boot: load user data first, then render the initial route
      (async () => {
        $("#app").innerHTML = '<div class="loading">Loading...</div>';
        await loadUserData();
        route();
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/" })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
