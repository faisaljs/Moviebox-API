services:
  moviebox-api:
    build: .
    container_name: moviebox-api
    labels:
      org.opencontainers.image.title: "MovieBox API Pro"
      org.opencontainers.image.authors: "Faisal (https://github.com/faisaljs)"
      org.opencontainers.image.source: "https://github.com/faisaljs/Moviebox-API"
      org.opencontainers.image.licenses: "MIT"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      CATALOG_DB: /app/data/catalog.db
      MOVIEBOX_BIND_HOST: 0.0.0.0
      MOVIEBOX_AUTH_USER: ${MOVIEBOX_AUTH_USER:?Set MOVIEBOX_AUTH_USER in .env}
      MOVIEBOX_AUTH_PASSWORD: ${MOVIEBOX_AUTH_PASSWORD:?Set MOVIEBOX_AUTH_PASSWORD in .env}
    volumes:
      - moviebox_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

volumes:
  moviebox_data:
    name: moviebox-data
